<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketLens — Démo interactive</title>
<style>
  :root {
    --yellow: #FFE600;
    --black: #1A1A1E;
    --page: #F5F5F1;
    --card: #FFFFFF;
    --text: #1A1A1E;
    --text-2: #5B5B60;
    --border: rgba(0,0,0,0.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 0 60px; }

  .hero {
    background: var(--black);
    color: #fff;
    padding: 36px 32px 30px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: var(--yellow);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
  }
  .hero-bar { width: 48px; height: 5px; background: var(--yellow); margin-bottom: 14px; }
  .hero h1 { font-size: 1.7rem; margin: 0 0 4px; position: relative; z-index: 1; }
  .hero p { margin: 0; color: #d8d8d5; font-size: 0.9rem; position: relative; z-index: 1; }

  .panel { padding: 24px 32px 0; }

  .chat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    min-height: 320px;
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  }
  .msg.agent .avatar { background: var(--black); color: var(--yellow); }
  .msg.user .avatar { background: var(--yellow); color: var(--black); }
  .bubble {
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
  }
  .msg.agent .bubble { background: #f1f1ee; border-top-left-radius: 3px; }
  .msg.user .bubble { background: var(--yellow); border-top-right-radius: 3px; font-weight: 600; }
  .bubble table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  .bubble th, .bubble td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .bubble th { color: var(--text-2); font-size: 0.7rem; text-transform: uppercase; }
  .bubble .tag { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: 700; margin-left: 4px; }
  .score-mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .score-chip { background: #f0f0eb; border-radius: 8px; padding: 3px 8px; font-size: 0.72rem; color: var(--text-2); }
  .score-chip strong { color: var(--text); }
  .brief-line { margin: 6px 0; line-height: 1.5; }
  .brief-line .ico { margin-right: 4px; }
  .exec-list { margin: 2px 0 10px 0; padding-left: 20px; }
  .exec-list li { margin: 3px 0; line-height: 1.45; font-size: 0.9rem; }
  .prio-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; }
  .prio-row:last-child { border-bottom: none; }
  .prio-name { font-weight: 600; }
  .prio-detail { color: var(--text-2); font-size: 0.78rem; }
  /* Couleurs reprises telles quelles de la mesure DAX "Couleur Jauge Attractivité" */
  .tag-prioriser { background: #2E7D32; color: #fff; }
  .tag-poursuivre { background: #4A8B43; color: #fff; }
  .tag-maintenir { background: var(--yellow); color: var(--black); }
  .tag-selective { background: #E89A52; color: var(--black); }
  .tag-reevaluer { background: #C65A5A; color: #fff; }

  .ext-brief {
    background: #fbfbf9;
    border: 1px solid var(--border);
    border-left: 4px solid #355C7D;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.85rem;
  }
  .ext-head { font-weight: 700; margin-bottom: 10px; font-size: 0.92rem; }
  .ext-date { font-weight: 400; font-size: 0.72rem; color: var(--text-2); }
  .ext-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
  .ext-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .ext-section-title { font-weight: 700; font-size: 0.8rem; margin-bottom: 5px; color: #355C7D; }
  .ext-num { display: inline-block; background: #355C7D; color: #fff; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; text-align: center; font-size: 0.65rem; margin-right: 2px; }
  .ext-list { margin: 0; padding-left: 20px; }
  .ext-list li { margin: 3px 0; line-height: 1.45; font-size: 0.85rem; }
  .ext-note { margin-top: 6px; font-size: 0.82rem; line-height: 1.45; color: var(--text-2); }
  .orient-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.78rem;
    color: #fff;
  }
  .orient-investir { background: #4A8B43; }
  .orient-maintenir { background: #6B7280; }
  .orient-reevaluer { background: #C65A5A; }

  .composer { display: flex; gap: 8px; margin-top: 14px; }
  #q {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 0.9rem;
    font-family: inherit;
  }
  #send {
    background: var(--black);
    color: var(--yellow);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #send:hover { opacity: 0.85; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--text-2);
  }
  .chip:hover { border-color: var(--yellow); color: var(--text); }

  .note {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--text-2);
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--yellow);
    border-radius: 8px;
    padding: 12px 16px;
  }
  footer {
    margin: 40px 32px 0;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.74rem;
    color: var(--text-2);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-bar"></div>
    <h1>MarketLens — Agent de veille décisionnelle</h1>
    <p>Démo interactive — Shop-EY</p>
  </div>

  <div class="panel">
    <div class="chat" id="chat"></div>

    <div class="composer">
      <input id="q" type="text" placeholder="Pose une question sur les 13 marchés…" autocomplete="off">
      <button id="send">Envoyer</button>
    </div>

    <div class="chips">
      <div class="chip" data-q="Quels marchés dois-je prioriser ?">Quels marchés prioriser ?</div>
      <div class="chip" data-q="Compare l'Inde et le Royaume-Uni">Compare l'Inde et le Royaume-Uni</div>
      <div class="chip" data-q="Quelles entreprises grandissent vite sans trop de risque ?">Croissance forte, risque maîtrisé</div>
      <div class="chip" data-q="Contexte externe pour l'Inde">Contexte externe : Inde</div>
      <div class="chip" data-q="Contexte externe pour le Royaume-Uni">Contexte externe : Royaume-Uni</div>
    </div>

  </div>

  <footer>EY — Données &amp; IA Canada, Septembre 2026.</footer>
</div>

function extSection(num, title, items) {
  const lis = items.map(t => `<li>${t}</li>`).join("");
  return `<div class="ext-section">
    <div class="ext-section-title"><span class="ext-num">${num}</span> ${title}</div>
    <ul class="ext-list">${lis}</ul>
  </div>`;
}

function externalBriefHTML(code) {
  const b = EXTERNAL_BRIEFS[code];
  if (!b) return null;
  const row = scoreRow(code);
  const orientLabel = { investir: "Investir", maintenir: "Maintenir", reevaluer: "Réévaluer" }[b.orientation];
  const orientClass = "orient-" + b.orientation;
  let html = `<div class="ext-brief">
    <div class="ext-head">MarketLens — Veille sur ${row.name_fr} <span class="ext-date">${b.date}</span></div>`;
  html += extSection(1, "Signaux Power BI", b.pb_signaux);
  html += extSection(2, "Contexte externe récent", b.contexte_externe);
  html += extSection(3, "Ce qui confirme le signal", b.confirmes);
  html += extSection(4, "Ce qui nuance / contredit", b.nuances);
  html += extSection(5, "Opportunités", b.opportunites);
  html += extSection(6, "Risques", b.risques);
  html += extSection(7, "Informations manquantes", b.manquantes);
  html += `<div class="ext-section">
    <div class="ext-section-title"><span class="ext-num">8</span> Sources et dates</div>
    <ul class="ext-list"><li>${b.sources.join("</li><li>")}</li></ul>
  </div>`;
  html += `<div class="ext-section">
    <div class="ext-section-title"><span class="ext-num">9</span> Orientation à approfondir</div>
    <div class="orient-badge ${orientClass}">${orientLabel}</div>
    <div class="ext-note">${b.orientation_note}<br><em>La décision finale reste humaine.</em></div>
  </div>`;
  html += `</div>`;
  return html;
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function findCountries(text) {
  const t = stripAccents(text);
  const matches = []; // {code, aliasLen}
  for (const [code, aliases] of Object.entries(DATA.aliases)) {
    for (const a of aliases) {
      const clean = stripAccents(a);
      // frontière de mot stricte : évite "AR" dans "comparer" ou "Inde" dans "Indonésie"
      const re = new RegExp('(^|[^a-z0-9])' + escapeRegex(clean) + '($|[^a-z0-9])');
      if (re.test(t)) { matches.push({ code, len: clean.length, pos: t.indexOf(clean) }); break; }
    }
  }
  // si plusieurs pays matchent avec un chevauchement de texte (ex. alias court inclus dans un alias
  // long d'un autre pays), on garde l'alias le plus long / le plus spécifique
  matches.sort((a, b) => a.pos - b.pos || b.len - a.len);
  const seen = new Set();
  const ordered = [];
  for (const m of matches) {
    if (!seen.has(m.code)) { seen.add(m.code); ordered.push(m.code); }
  }
  return ordered;
}

function findCompanies(text) {
  const t = stripAccents(text);
  const found = [];
  for (const [id, aliases] of Object.entries(DATA.company_aliases)) {
    for (const a of aliases) {
      const clean = stripAccents(a);
      const re = new RegExp('(^|[^a-z0-9])' + escapeRegex(clean) + '($|[^a-z0-9])');
      if (re.test(t)) { found.push(id); break; }
    }
  }
  return [...new Set(found)];
}

function tagClass(orientation) {
  // Reprend exactement les seuils de la mesure DAX "Couleur Jauge Attractivité"
  return {
    "Prioriser l'investissement": "prioriser",
    "Poursuivre les investissements": "poursuivre",
    "Maintenir et optimiser": "maintenir",
    "Investir de façon sélective": "selective",
    "Réévaluer avant d'investir": "reevaluer",
  }[orientation];
}

function scoreRow(code) {
  return DATA.scorecard.find(r => r.code === code);
}

function addMessage(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="avatar">${role === 'agent' ? 'IA' : 'YB'}</div><div class="bubble">${html}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function pct(v) { return (v === null || v === undefined) ? "n/d" : v + "%"; }

function plural(n, singular, plural_) {
  return n <= 1 ? singular : (plural_ || singular + "s");
}
function entreprises(n) { return n <= 1 ? "entreprise" : "entreprises"; }
function suivies(n) { return n <= 1 ? "suivie" : "suivies"; }

function briefCardHTML(code) {
  const b = DATA.briefs[code];
  const tag = `<span class="tag tag-${tagClass(b.orientation)}">${b.orientation} · ${b.score_attractivite}/100</span>`;
  const s = b.subscores;
  let html = `<strong>${b.name_fr}</strong> ${tag}`;
  html += `<div class="score-mini">
    <span class="score-chip">Taille marché <strong>${s.taille}</strong></span>
    <span class="score-chip">Pouvoir d'achat <strong>${s.pouvoir_achat}</strong></span>
    <span class="score-chip">Croissance PIB <strong>${s.croissance_pib ?? "n/d"}</strong></span>
    <span class="score-chip">Maturité digitale <strong>${s.maturite_digitale}</strong></span>
    <span class="score-chip">Dynamique IDE <strong>${s.dynamique_investissement}</strong></span>
  </div>`;
  if (b.n_companies) {
    html += `<div class="brief-line"><strong>${b.n_companies} ${entreprises(b.n_companies)} e-commerce ${suivies(b.n_companies)}</strong></div>`;
    html += `<ul class="exec-list">`;
    html += `<li>Croissance moyenne du revenu : <strong>${pct(b.avg_growth_pct)}/an</strong></li>`;
    html += `<li>Marge opérationnelle moyenne : <strong>${pct(b.avg_margin_pct)}</strong></li>`;
    html += `<li><strong>${b.n_above_growth_benchmark}/${b.n_companies}</strong> au-dessus de la médiane mondiale de croissance (11,7%, base 43 entreprises)</li>`;
    if (b.top_company) html += `<li>Meilleure performance : <strong>${b.top_company.name}</strong> (${pct(b.top_company.growth_pct)})</li>`;
    if (b.weak_company && b.weak_company.name !== b.top_company?.name) html += `<li>Plus en difficulté : <strong>${b.weak_company.name}</strong> (${pct(b.weak_company.growth_pct)})</li>`;
    html += `</ul>`;
  }
  html += `<div class="brief-line"><strong>Recommandation :</strong> ${b.reco_text}</div>`;
  if (b.projection) {
    html += `<div class="brief-line"><strong>Projection FMI 2026 :</strong> ${b.projection.proj_2026_pct}% de croissance du PIB (vs ${b.projection.hist_pct}%/an en moyenne historique) → ${b.projection.label}.</div>`;
  }
  if (EXTERNAL_BRIEFS[code]) {
    html += `<div class="brief-line" style="color:var(--text-2);font-size:0.78rem;">Une investigation externe (réglementation, actualité) est disponible pour ce marché — demande « contexte externe ${b.name_fr} ».</div>`;
  }
  return html;
}

function companyCardHTML(id) {
  const c = DATA.companies.find(r => r.company_id === id);
  if (!c) return null;
  const row = scoreRow(c.country_code);
  let html = `<strong>${c.name}</strong> <span class="tag" style="background:#e4e4de;color:var(--text);">${c.name_fr}</span>`;
  html += `<div class="brief-line"><strong>Croissance du revenu :</strong> ${pct(c.revenue_cagr)}/an (${c.ecart_croissance_pp >= 0 ? "+" : ""}${c.ecart_croissance_pp} pp vs médiane des 43 entreprises).</div>`;
  html += `<div class="brief-line"><strong>Marge opérationnelle :</strong> ${pct(c.operating_margin)} (${c.ecart_marge_pp >= 0 ? "+" : ""}${c.ecart_marge_pp} pp vs médiane).</div>`;
  html += `<div class="brief-line">${c.lecture_risque}</div>`;
  html += `<div class="brief-line">${c.lecture_cash}</div>`;
  html += `<div class="brief-line">${c.lecture_baisse}</div>`;
  if (row) html += `<div class="brief-line" style="color:var(--text-2);font-size:0.78rem;">Marché (${c.name_fr}) : score d'attractivité ${row.score_attractivite}/100 → ${row.orientation}. Demande « analyse ${c.name_fr} » pour le détail pays.</div>`;
  return html;

function handlePrioritize() {
  const groups = DATA.orientation_groups;

  for (const q of order) {
    const list = groups[q] || [];
    html += `<br><span class="tag tag-${tagClass(q)}">${q}</span><div style="margin-top:4px;">`;
    if (!list.length) {
      html += `<span class="prio-detail">—</span>`;
    } else {
      for (const c of list) {
        const growthTxt = c.avg_growth_pct !== null && c.avg_growth_pct !== undefined
          ? `croissance ${entreprises(c.n_companies)} ${c.avg_growth_pct}%/an (${c.n_companies} ${suivies(c.n_companies)})`
          : "pas d'entreprise suivie";
        html += `<div class="prio-row"><span class="prio-name">${c.name_fr}</span><span class="prio-detail">${c.score}/100 · ${growthTxt}</span></div>`;
      }
    }
    html += `</div>`;
  }
  html += "<br>Tape le nom d'un marché pour le détail complet (ex. « analyse l'Inde »), ou « pourquoi » pour creuser un cas précis.";

function handleBest(text) {
  const t = stripAccents(text);
  const worst = /risqu|eviter|pire|moins attractif|ne pas investir|prudence/.test(t);
  const sorted = [...DATA.scorecard].sort((a, b) => worst ? a.score_attractivite - b.score_attractivite : b.score_attractivite - a.score_attractivite);
  const top = sorted.slice(0, 3);
  let html = worst
    ? "Les marchés avec le score d'attractivité Power BI le plus faible :<br><br>"
    : "Les marchés avec le meilleur score d'attractivité Power BI :<br><br>";
  for (const r of top) html += briefCardHTML(r.code) + "<br><br>";
  addMessage('agent', html);
}

function handleCompare(codes) {
  let html = "Comparaison :<br><br>";
  for (const c of codes.slice(0, 3)) {
    html += briefCardHTML(c) + "<br><br>";
  }
  addMessage('agent', html);
}

function handleSingleCountry(code) {
  addMessage('agent', briefCardHTML(code));
}

function handleCompanies(ids) {
  let html = "";
  for (const id of ids.slice(0, 3)) {
    const card = companyCardHTML(id);
    if (card) html += card + "<br><br>";
  }
  addMessage('agent', html || "Je n'ai pas retrouvé cette entreprise dans les 43 suivies.");
}

function nearbyNumber(t, keywordRe) {
  // cherche un nombre proche (avant OU après) d'un mot-clé, plutôt que de supposer un ordre fixe
  // (?:...) isole l'alternance du mot-clé pour qu'elle ne "mange" pas le reste du motif
  const kw = '(?:' + keywordRe.source + ')';
  let m = t.match(new RegExp(kw + '\\D{0,15}?(\\d+)\\s*%'));
  if (m) return parseInt(m[1], 10);
  m = t.match(new RegExp('(\\d+)\\s*%\\D{0,15}?' + kw));
  if (m) return parseInt(m[1], 10);
  return null;
}

function handleGrowthQuery(text, countryFilter) {
  const t = stripAccents(text);
  let minGrowth = nearbyNumber(t, /croissance|grandi/);
  let maxVol = nearbyNumber(t, /risque|volatilit/);
  // repli : si un seul des deux mots-clés est présent avec un chiffre, ou aucun chiffre du tout,
  // on garde des seuils par défaut raisonnables plutôt que de deviner à partir de l'ordre des nombres
  if (minGrowth === null) minGrowth = 20;
  if (maxVol === null) maxVol = 50;

  let results = DATA.companies
    .filter(c => c.revenue_cagr > minGrowth && c.annualized_volatility < maxVol)
    .sort((a, b) => b.revenue_cagr - a.revenue_cagr);
  if (countryFilter && countryFilter.length) {
    results = results.filter(c => countryFilter.includes(c.country_code));
  }

  let html = `Critère appliqué : croissance annuelle &gt; ${minGrowth}% ET volatilité &lt; ${maxVol}%.<br>`;
  html += `<strong>${results.length} ${entreprises(results.length)}</strong> ${results.length <= 1 ? "qualifie" : "qualifient"} :`;
  html += `<table><thead><tr><th>Entreprise</th><th>Marché</th><th>Croissance</th><th>Risque</th></tr></thead><tbody>`;
  for (const r of results.slice(0, 10)) {
    html += `<tr><td>${r.name}</td><td>${r.name_fr}</td><td>${r.revenue_cagr}%</td><td>${r.annualized_volatility}%</td></tr>`;
  }
  html += `</tbody></table>`;
  const byCountry = {};
  results.forEach(r => byCountry[r.name_fr] = (byCountry[r.name_fr] || 0) + 1);
  const dominant = Object.entries(byCountry).sort((a, b) => b[1] - a[1])[0];
  if (dominant) html += `<br>Marché le plus représenté : <strong>${dominant[0]}</strong> (${dominant[1]} ${entreprises(dominant[1])}).`;
  addMessage('agent', html);
}

function handleExternalInvestigation(code) {
  const html = externalBriefHTML(code);
  if (html) {
    addMessage('agent', html);
  } else {
    const row = scoreRow(code);
    addMessage('agent',
      `Je n'ai pas d'investigation externe préparée pour ${row ? row.name_fr : "ce marché"} — actuellement disponible pour l'Inde et le Royaume-Uni. ` +
      `Je peux quand même te donner le signal interne :<br><br>` + briefCardHTML(code));
  }
}

function helpMessage() {
  addMessage('agent',
    "Je n'ai pas de réponse toute faite pour cette formulation précise, mais voici ce que je sais faire avec les données du cas (essaie de reformuler, ou pose une question sur un pays / une entreprise directement) :<br>" +
    "• « quels marchés prioriser » ou « quel est le meilleur / le plus risqué »<br>" +
    "• « analyse / que penses-tu de [pays] » — note complète<br>" +
    "• « compare [pays A] et [pays B] »<br>" +
    "• « comment va [entreprise] » (ex. Zomato, Auto Trader, Shopify...)<br>" +
    "• « entreprises avec forte croissance et risque maîtrisé » (avec ou sans seuils, ex. 25% / 40%)<br>" +
    "• « contexte externe [pays] » — confronte le signal à l'actualité (Inde, Royaume-Uni)"
  );
}

function respond(text) {
  const t = stripAccents(text);
  const countries = findCountries(text);
  const companies = findCompanies(text);

  const isGreeting = /^(salut|bonjour|bonsoir|hello|hey|coucou|ca va|comment vas tu)\b/.test(t.trim());
  const isThanks = /merci|thanks|super|top|nickel|parfait/.test(t) && t.length < 40;

  if (isGreeting) {
    addMessage('agent', "Salut ! Pose-moi une question sur les 13 marchés de Shop-EY ou sur une des 43 entreprises suivies — analyse pays, comparaison, filtrage par critères, ou contexte externe (Inde / Royaume-Uni).");
    return;
  }
  if (isThanks) {
    addMessage('agent', "Avec plaisir. Autre chose à creuser ?");
    return;
  }

  if (/contexte externe|investigat|veille|challenge|actualite|reglement/.test(t) && countries.length >= 1) {
    handleExternalInvestigation(countries[0]);
  } else if (/meilleur|top march|plus attractif|plus risqu|eviter|pire march|moins attractif|ne pas investir/.test(t) && countries.length === 0) {
    handleBest(text);
  } else if (/prioris|ou investir|quels march|comment se repartissent|classement|repartition/.test(t)) {
    handlePrioritize();
  } else if (/compar|versus|\bvs\b|face a face/.test(t) && countries.length >= 2) {
    handleCompare(countries);
  } else if (companies.length >= 1 && countries.length === 0) {
    handleCompanies(companies);
  } else if (/(recommand|analys|que pense|avis sur|resum|explique|dis[- ]moi|parle[- ]moi|info sur|detail|pourquoi)/.test(t) && countries.length >= 1) {
    handleSingleCountry(countries[0]);
  } else if (/croissance|risque|volatilit|grandiss|opportunit|screening|quelles entreprises|meilleures entreprises/.test(t)) {
    handleGrowthQuery(text, countries);
  } else if (countries.length === 1) {
    handleSingleCountry(countries[0]);
  } else if (countries.length >= 2) {
    handleCompare(countries);
  } else if (companies.length >= 1) {
    handleCompanies(companies);
  } else {
    helpMessage();
  }
}

function send() {
  const input = document.getElementById('q');
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = '';
  setTimeout(() => respond(text), 250);
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('q').value = chip.dataset.q;
    send();
  });
});
